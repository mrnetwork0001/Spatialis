<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Spatialis furniture contact sheet</title>
<link rel="icon" type="image/png" sizes="32x32" href="../brand/spatialis-logo-32.png">
<link rel="icon" type="image/png" sizes="192x192" href="../brand/spatialis-logo-192.png">
<link rel="apple-touch-icon" sizes="192x192" href="../brand/spatialis-logo-192.png">
<style>
  body { margin:0; background:#060609; color:#f2f2f5;
         font:13px -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; }
  h1 { font-size:15px; margin:14px 20px 2px; font-weight:600; }
  p.sub { margin:0 20px 12px; color:#8b8b98; font-size:12px; }
  #grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(220px,1fr)); gap:1px; background:#20202b; }
  #grid canvas { display:block; width:100%; height:auto; }
  .cell { background:#0a0a10; position:relative; }
  .cap { position:absolute; left:10px; bottom:8px; pointer-events:none; }
  .cap b { display:block; font-size:12.5px; }
  .cap span { font-family:ui-monospace,Menlo,monospace; font-size:10px; color:#a5966b; }
  .err { color:#f87171; font-family:ui-monospace,monospace; font-size:11px; padding:10px; }
</style>
<h1>Spatialis furniture catalog</h1>
<p class="sub"><a class="back" href="../" style="color:#7ee705">&larr; Back to Spatialis</a></p>
<p class="sub">Generated .glb, parsed by three.js GLTFLoader - an independent reader, not the generator. Grid squares are 50&nbsp;cm. Models are centimetre-authored, shown at 1/100.</p>
<div id="grid"></div>
<script type="importmap">
{"imports":{
  "three":"../Simulator/vendor/three.module.js",
  "three/addons/":"../Simulator/vendor/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

const KEYS = ["sofa","chair","table","coffeeTable","lamp","tableLamp",
              "shelf","plant","rug","artwork","vase","bed"];
const W = 350, H = 300;
const grid = document.getElementById('grid');
const loader = new GLTFLoader();
let done = 0;

for (const key of KEYS) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.style.height = H + 'px';
  grid.appendChild(cell);

  const scene = new THREE.Scene();
  scene.background = new THREE.Color(0x0a0a10);
  const cam = new THREE.PerspectiveCamera(32, W / H, 0.01, 100);
  const renderer = new THREE.WebGLRenderer({ antialias: true });
  renderer.setSize(W, H);
  renderer.outputColorSpace = THREE.SRGBColorSpace;
  cell.appendChild(renderer.domElement);

  scene.add(new THREE.HemisphereLight(0xdfe8ff, 0x2a2f3a, 2.2));
  const key1 = new THREE.DirectionalLight(0xffffff, 2.4);
  key1.position.set(3, 5, 4); scene.add(key1);
  const key2 = new THREE.DirectionalLight(0x8fb6ff, 0.7);
  key2.position.set(-4, 2, -3); scene.add(key2);

  // 50cm grid = 0.5 world units, since models are authored in metres.
  const g = new THREE.GridHelper(6, 12, 0x2a2a37, 0x20202b);
  scene.add(g);

  loader.load(`../Assets/Prefabs/${key}.glb`, (gltf) => {
    const obj = gltf.scene;
    obj.scale.setScalar(0.01);            // models are authored in centimetres
    scene.add(obj);
    const bb = new THREE.Box3().setFromObject(obj);
    const size = bb.getSize(new THREE.Vector3());
    const ctr = bb.getCenter(new THREE.Vector3());
    const radius = Math.max(size.x, size.y, size.z);
    cam.position.set(ctr.x + radius * 1.15, bb.max.y * 0.85 + radius * 0.5, ctr.z + radius * 1.7);
    cam.lookAt(ctr.x, bb.min.y + size.y * 0.45, ctr.z);
    renderer.render(scene, cam);

    const cap = document.createElement('div');
    cap.className = 'cap';
    cap.innerHTML = `<b>${key}</b><span>${(size.x*100).toFixed(0)} × ${(size.z*100).toFixed(0)} × ${(size.y*100).toFixed(0)} cm` +
                    ` · base y=${(bb.min.y*100).toFixed(1)}</span>`;
    cell.appendChild(cap);
    if (++done === KEYS.length) document.documentElement.dataset.ready = '1';
  }, undefined, (err) => {
    cell.innerHTML = `<div class="err">${key}: LOAD FAILED<br>${err}</div>`;
    if (++done === KEYS.length) document.documentElement.dataset.ready = '1';
  });
}
</script>
