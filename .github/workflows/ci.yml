name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Strict type check of all four subsystems against the local Lens Studio
      # API declarations, which stand in for the types the editor injects. The
      # same sources are also checked against Snap's real StudioLib.d.ts by
      # `npm run typecheck:lens`, which needs a local Lens Studio and so cannot
      # run here.
      - name: Typecheck
        run: npm run typecheck

      # 161 behavioural tests across all four subsystems, including an
      # end-to-end voice -> placement -> material integration. No headset needed.
      - name: Test
        run: npm test

      # The simulator bundles the same sources as browser ES modules; building
      # it here keeps that path from rotting unnoticed.
      - name: Build simulator
        run: npm run build:web

      # The Lens Studio project carries its own copies of the scripts and the
      # metre-scale models. If they drift from the sources, the Lens and the
      # browser stop being the same code - which is the project's central claim.
      - name: Lens project in sync
        run: bash Tools/sync-lens.sh --check

      # The simulator is plain ES modules that tsc never sees. Catch a syntax
      # error there before it ships as a page that silently fails to start.
      - name: Syntax-check simulator modules
        run: |
          for f in Simulator/*.js; do cp "$f" /tmp/check.mjs && node --check /tmp/check.mjs; done
