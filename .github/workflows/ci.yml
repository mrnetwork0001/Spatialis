name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  verify:
    name: Typecheck, test, build
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Strict type check of all four subsystems against the local Lens Studio
      # API declarations. Lens Studio injects its own types in-editor, so this
      # is the only place the source is checked outside the editor.
      - name: Typecheck
        run: npm run typecheck

      # 151 behavioural tests across all four subsystems, including an
      # end-to-end voice -> placement -> material integration. No headset needed.
      - name: Test
        run: npm test

      # The simulator bundles the same sources as browser ES modules; building
      # it here keeps that path from rotting unnoticed.
      - name: Build simulator
        run: npm run build:web
